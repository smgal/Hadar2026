<!--
  아이콘은 여기 한 곳에 있다.

  고정 24×24 격자에 선으로만 그린다 — 칠하지 않는 것은 색이 **상태**를
  말해야 하기 때문이다. 글리프가 "무엇인지" 를 말하고 색이 "지금 어떤지"
  를 말한다. 둘을 한 요소에 겹쳐 칠하면 둘 다 안 읽힌다.

  무기는 갈래(베다·찍다)가 아니라 **생김새**(날·도끼·활)로 고른다.
  같은 갈래라도 장검과 활은 손에 쥐는 것이 다르고, 눈은 그 차이를 먼저
  본다. 갈래는 묶음 머리글과 검색이 말한다.
-->

<header>
  <div class="brand">
    <svg class="ico" viewBox="0 0 24 24"><use href="#g-blade"/></svg>
    <b>hd_world</b><span class="muted">실험실</span>
  </div>

  <nav class="tabs" id="tabs">
    <button data-tab="gear" class="on">장비</button>
    <button data-tab="pack">가방</button>
    <button data-tab="fight">전투</button>
    <button data-tab="flags">플래그</button>
    <button data-tab="record">기록</button>
  </nav>

  <label class="search">
    <svg class="ico sm" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.4"/><path d="M15.2 15.2 L20.4 20.4"/></svg>
    <input id="q" type="search" spellcheck="false"
           placeholder="이름/갈래, is:착용 is:겹침 kind:slash slot:leftHand -is:양손">
    <button id="qClear" class="ghost" title="지우기">✕</button>
  </label>

  <div class="grow"></div>

  <!-- 마법의 횃불은 여기 없다. 그것이 바꾸는 것(시야·횃불·달빛)이
       아래 요약 줄에 있으므로 단추도 그 옆에 있다. -->
  <button id="save" class="ghost" title="지금 세계를 파일로 받는다">내려받기</button>
  <button id="loadBtn" class="ghost" title="세이브 파일을 올려 이 세계를 바꾼다">불러오기</button>
  <input id="loadFile" type="file" accept="application/json" hidden>
  <button id="reset" class="ghost">처음으로</button>
</header>

<div id="bar" class="bar"></div>

<main>
  <section id="tab-gear" class="tab">
    <div id="party" class="party"></div>
  </section>

  <section id="tab-pack" class="tab" hidden>
    <div id="packFull"></div>
  </section>

  <!--
    격자 하나가 B5 의 규칙을 그대로 그린다.

        거리(a, e) = gap + (a.rank - 1) + (e.rank - 1)

    y 축이 거리다. 위가 적, 아래가 아군, 가운데 빈 줄이 `gap`. 아군
    한 줄에서 적 한 줄까지 **줄을 세면** 그것이 곧 거리다 — 식을 읽지
    않아도 보인다.
  -->
  <section id="tab-fight" class="tab" hidden>
    <div id="fightBoard"></div>
  </section>

  <section id="tab-flags" class="tab" hidden>
    <div id="flags"></div>
  </section>

  <section id="tab-record" class="tab" hidden>
    <div id="record"></div>
  </section>
</main>

<!--
  오른쪽 기둥은 **지금 탭이 쓰는 것만** 보인다.

  물건 자세히와 「바꾸면 뭐가 달라지나」는 장비·가방에서만 뜻이 있고,
  플래그 탭에서 물건 설명이 열려 있으면 무엇을 보고 있는 화면인지가
  흐려진다. `data-for` 가 어느 탭의 것인지를 말하고, 없으면 늘 보인다.
-->
<aside id="side">
  <div id="detail" class="card" data-for="gear pack"></div>
  <div id="diff" class="card" data-for="gear pack" hidden></div>
  <div class="card" data-for="gear pack">
    <h3>장비 모음</h3>
    <div id="loadouts" class="loadouts"></div>
  </div>
  <div class="card">
    <h3>일어난 일</h3>
    <div id="log"></div>
  </div>
  <div class="card" data-for="gear pack flags">
    <h3 id="legendTitle">색이 말하는 것</h3>
    <div id="legend" class="legend"></div>
  </div>
</aside>

<script src="icons.js"></script>
<script src="foes.js"></script>
<script src="app.js"></script>
</body>
</html>
