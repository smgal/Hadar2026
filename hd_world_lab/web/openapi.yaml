openapi: 3.0.3
info:
  title: hd_world lab API
  version: "0.1.0"
  description: |
    `packages/hd_world` 를 HTTP 로 조작하는 표면. 두 클라이언트가 이 문을 쓴다 —
    `GET /` 의 장비 화면(마우스), 그리고 스크립트·에이전트(JSON).

    **모델이 이미 명령과 사실로 말하기 때문에** 이 서버는 규칙을 하나도 갖지 않는다.
    명령을 해석해 넘기고, 돌아온 이벤트와 새 상태를 그대로 싣는다.

    ## 세 가지만 알면 된다

    1. **파생값은 저장되지 않는다.** 무기 종류·최종 수치·파티가 지날 수 있는 지형·
       어둠 속 시야는 전부 읽을 때 계산된다. 호출 순서가 없고 무효화가 없다.
    2. **아무것도 throw 하지 않는다.** 거절은 `kind: refused` 이벤트로 오고
       `reason` 이 닫힌 열거다. 세계는 그대로다.
    3. **한국어는 `GET /api/text`** 에 있다. 모델은 키만 들고 있어서 화면마다
       이름이 갈리지 않는다.

    도메인 설명은 `GET /api/guide` 가 markdown 으로 준다 — 스펙은 필드를 말하고
    가이드는 뜻을 말한다.
servers:
  - url: http://127.0.0.1:5330
    description: |
      로컬 실험실. **인증이 없다** — 개발용 1인 서버이고 메모리 안의 파티 하나를
      읽고 쓴다. localhost 밖으로 낼 것을 전제로 만들지 않았다.

security: []

tags:
  - name: 읽기
  - name: 쓰기
  - name: 안내

paths:
  /api/guide:
    get:
      tags: [안내]
      operationId: getGuide
      summary: 도메인 안내 (markdown)
      responses:
        "200":
          description: 안내 본문
          content:
            text/markdown:
              schema: { type: string }

  /api/state:
    get:
      tags: [읽기]
      operationId: getState
      summary: 파티 전체 — 파생값까지 계산된 상태
      responses:
        "200":
          description: 지금 상태
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorldView" }

  /api/catalog:
    get:
      tags: [읽기]
      operationId: getCatalog
      summary: 아이템 전량 · 부위 목록 · 지시 목록 (이름 포함)
      responses:
        "200":
          description: 카탈로그
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/ItemView" }
                  slots: { type: array, items: { type: object } }
                  styles: { type: array, items: { type: object } }

  /api/text:
    get:
      tags: [읽기]
      operationId: getText
      summary: 이름표 전부 (열거 → 한국어)
      description: |
        `slot` `class` `classType` `skill` `weaponKind` `style` `styleHint`
        `stat` `capability` `ailment` `refusal` `item` `annex` `op`.
        화면은 한국어를 스스로 갖지 않고 이것만 본다.
      responses:
        "200":
          description: 이름표
          content:
            application/json:
              schema: { type: object, additionalProperties: { type: object } }

  /api/candidates:
    get:
      tags: [읽기]
      operationId: getCandidates
      summary: 그 부위에 지금 채울 수 있는 것
      description: |
        `checkEquip` 과 **같은 필터**를 통과한 것만 돌려준다. 그래서 화면이 내놓는
        목록과 명령이 받아들이는 것이 어긋날 수 없다.
      parameters:
        - in: query
          name: member
          required: true
          schema: { type: string }
          example: knight
        - in: query
          name: slot
          required: true
          schema: { $ref: "#/components/schemas/SlotName" }
      responses:
        "200":
          description: 채울 수 있는 것
          content:
            application/json:
              schema:
                type: object
                properties:
                  member: { type: string }
                  slot: { type: string }
                  items: { type: array, items: { type: string } }
        "400":
          description: member 또는 slot 이 없거나 모르는 값
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DecodeError" }

  /api/eligibility:
    get:
      tags: [읽기]
      operationId: getEligibility
      summary: 누가 · 무엇을 · 어디에 — 판 전체를 한 번에
      description: |
        `/api/candidates` 가 한 칸을 묻는다면 이쪽은 **판 전체**를 답한다.
        사람마다, 물건마다, 부위 여덟 각각이 `true` 또는 **거절 이유**다.

        화면이 칸에 색을 칠할 때 마우스보다 왕복이 느리고, 그렇다고 규칙을
        브라우저에 옮겨 둘 수는 없다 — 판단하는 것은 `checkEquip` 하나뿐이다.
        그래서 통째로 미리 답해 둔다.

        **`carried` 는 따로 온다.** `checkEquip` 이 가지고 있는지를 묻지 않기
        때문이고, 화면에서도 「안 가지고 있다」 와 「직업이 아니다」 는 다른
        색이어야 하기 때문이다.
      responses:
        "200":
          description: 판 전체
          content:
            application/json:
              schema:
                type: object
                properties:
                  members:
                    type: object
                    description: 사람 ref → 물건 ref → 부위 이름 → true 또는 거절 이유
                    additionalProperties:
                      type: object
                      additionalProperties:
                        type: object
                        additionalProperties:
                          oneOf:
                            - type: boolean
                            - $ref: "#/components/schemas/RefusalReason"
                  equippedBy:
                    type: object
                    description: 물건 ref → 지금 그것을 차고 있는 사람과 부위
                    additionalProperties:
                      type: array
                      items:
                        type: object
                        properties:
                          member: { type: string }
                          slot: { $ref: "#/components/schemas/SlotName" }
                  carried:
                    type: object
                    description: 물건 ref → 가방에 있는 개수
                    additionalProperties: { type: integer }
                  packCapacity:
                    type: integer
                    description: 가방이 받는 **종류**의 수. 개수가 아니다
                  packKinds: { type: integer }
                  packUnits: { type: integer }

  /api/preview:
    post:
      tags: [읽기]
      operationId: previewCommand
      summary: 적용하면 무엇이 달라지는지만 말한다
      description: |
        `/api/command` 와 **같은 몸통**을 받고 세계를 만지지 않는다. 사본에
        굴려 차이만 돌려준다.

        사본은 `saveWorld` → `loadWorld` 왕복으로 만든다. 저장 형식이 이미
        "다시 계산할 수 없는 것 전부" 로 정의돼 있고 그것이 곧 복사가 실어야
        할 것의 정의이기 때문이다. 손으로 쓴 복사는 그 목록을 한 벌 더 만드는
        일이고, 두 목록은 언젠가 갈라진다.

        `changes` 는 **달라진 것만** 싣는다. 바뀌지 않은 값을 같이 보내면
        읽는 사람이 비교 칸을 안 보게 된다. 값마다 실린 `table` 은 그것이 어느
        이름표의 것인지를 말한다 — 서버는 한국어를 갖지 않는다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  properties:
                    command: { $ref: "#/components/schemas/Command" }
                - type: object
                  properties:
                    commands:
                      type: array
                      items: { $ref: "#/components/schemas/Command" }
                - $ref: "#/components/schemas/Command"
            examples:
              장검을들면:
                value:
                  command:
                    kind: equip
                    member: knight
                    slot: rightHand
                    item: weapon.long_sword
      responses:
        "200":
          description: 차이. 거절도 200 이다
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Preview" }
        "400":
          description: 읽을 수 없는 명령
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DecodeError" }

  /api/enemies:
    get:
      tags: [읽기]
      operationId: getEnemies
      summary: 이 빌드가 아는 적 전부
      description: |
        판을 짤 때 고를 수 있는 것. `key` 가 `POST /api/battle/start` 의
        `enemyKeys` 에 들어간다.

        화면은 이 목록에 **모양 하나와 고유한 색 하나**를 짝지어 그린다
        (`web/foes.js`). 적이 늘면 그 표에도 줄을 더해야 한다.
      responses:
        "200":
          description: 적 목록
          content:
            application/json:
              schema:
                type: object
                properties:
                  enemies:
                    type: array
                    items:
                      type: object
                      properties:
                        key: { type: string, example: orc }
                        name: { type: string }
                        level: { type: integer }
                        endurance: { type: integer }

  /api/battle/state:
    get:
      tags: [읽기]
      operationId: getFight
      summary: 열려 있는 판 — 격자와, 지금 묻는 것
      description: |
        판이 없으면 `{"open": false}` 다.
      responses:
        "200":
          description: 판
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Fight" }

  /api/battle/start:
    post:
      tags: [쓰기]
      operationId: startFight
      summary: 한 판을 연다
      description: |
        `POST /api/battle` 는 끝까지 스스로 굴린다. 이쪽은 **물음마다
        멈춘다.**

        ## 위치는 정수 둘이다

        좌표가 아니다. 각자가 **열**(1 앞 ~ 3 뒤)을 갖고, 양측이 **간격**
        하나(0~2)를 나눠 갖는다.

            거리 = 간격 + (내 열 - 1) + (상대 열 - 1)

        그래서 「우리가 나아간다」 와 「그들이 다가온다」 는 **같은
        사건**이다. `enemyRanks` 를 빼면 등록 순서로 앞에서부터 세운다.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                enemyKeys:
                  type: array
                  items: { type: string }
                enemyRanks:
                  type: array
                  description: 적마다의 열 1~3. 없으면 알아서 세운다
                  items: { type: integer, minimum: 1, maximum: 3 }
                initialGap: { type: integer, minimum: 0, maximum: 2 }
                seed:
                  type: integer
                  description: 같은 씨앗이면 같은 결과다
            examples:
              멀리서:
                value:
                  enemyKeys: [orc, wolf, dragon]
                  enemyRanks: [1, 1, 3]
                  initialGap: 2
                  seed: 11
      responses:
        "200":
          description: 연 판. 모르는 적이면 `keys` 에 담아 돌려준다
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Fight" }

  /api/battle/command:
    post:
      tags: [쓰기]
      operationId: answerFight
      summary: 물은 것에 답한다
      description: |
        `hd_battle` 의 `BattleCommand` 그대로다 — `action` · `target` ·
        `spell` · `item` · `itemUse` · `ally` · `cancel`.

        답하면 **다음 물음이 나올 때까지** 알아서 굴린다. `advance` 를
        따로 누르지 않는다.

        **답해도 판이 바로 움직이지는 않는다.** 라운드 시작에 전원
        명령 → 일괄 해결이라, 대열을 당기라는 지시도 나머지가 다 답한
        뒤에 반영된다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                command: { type: object }
            examples:
              공격: { value: { command: { type: action, slot: 0, action: attack } } }
              적을고른다: { value: { command: { type: target, slot: 0, enemyIndex: 2 } } }
              취소: { value: { command: { type: cancel, slot: 0 } } }
      responses:
        "200":
          description: 답한 뒤의 판. 못 읽은 답도 200 이고 `error` 가 실린다
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Fight" }

  /api/battle/settle:
    post:
      tags: [쓰기]
      operationId: settleFight
      summary: 결과를 파티에 얹는다
      description: |
        체력 · 경험치 · 쓴 물건 · 떠난 사람. **한 번만 얹는다** — 두 번
        부르면 `already settled` 다.
      responses:
        "200":
          description: 얹은 것

  /api/battle/abandon:
    post:
      tags: [쓰기]
      operationId: abandonFight
      summary: 열린 판을 버린다
      responses:
        "200":
          description: 빈 판

  /api/quest:
    get:
      tags: [읽기]
      operationId: getQuest
      summary: 플래그 전부 — 무슨 뜻이고 지금 어디까지 왔나
      description: |
        게임이 아는 것은 번호뿐이다. `Flag::Set(41)` 은 41번을 켤 뿐이고
        그것이 무엇을 뜻하는지는 아무 데도 없다. `flag4ep1.cm2` 가 이름을
        붙이지만 이름까지고 — **언제 켜지는지 · 켜지면 무엇이 열리는지**는
        없다.

        그래서 칸마다 **날값과 사람 말이 같이** 온다. `raw` 가
        `Flag::IsSet(41) = 1` 이고 `title`·`detail` 이 뜻이다. 하나만으로는
        모자란다 — 숫자는 뜻을 모르고 문장은 고칠 수가 없다.

        ## 갈래가 둘이다

        원작이 둘로 쓰기 때문이다.

        * `toggle` — `Flag::Set`·`Reset`·`IsSet`. 켜졌나 꺼졌나.
        * `step` — `Variable::Set`·`Add`·`Get`. 몇 번째 단계인가.
          값 하나가 **여러 사실**을 담는다: 3이면 1과 2는 끝났고 3을 하는
          중이다. `stepStates` 가 그것을 `done`·`current`·`ahead` 로
          갈라 준다.

        ## granted

        플래그가 파티의 통행 능력을 열 수 있다. 물 위를 걷는 것이
        **부적**(차고 있는 동안) · **마법**(남은 칸 수) 에 이어 세 번째
        출처를 갖는 것이고, 앞의 둘과 달리 꺼지지 않고 줄지 않는다.

        `hd_world` 는 플래그를 모르고 몰라야 한다 — 아는 순간 모델이
        시나리오에 매인다. 합치는 것은 읽는 쪽의 일이고 `granted` 가
        그 자리다.

        ## collisions

        같은 번호를 두 갈래가 쓰는 곳. 게임은 번호만 아니까 `D1-010` 과
        다른 데의 맨 `Flag::Set(10)` 은 **한 칸**이다. 지금 실제로 셋이다
        (10 · 31 · 50) — `lore_ep1.cm2` · `town2.cm2` · `menace.cm2` 가
        `flag4ep1.cm2` 를 include 하지 않고 번호를 직접 쓴다.
      responses:
        "200":
          description: 레지스트리 + 지금 값
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Quest" }

    post:
      tags: [쓰기]
      operationId: setFlag
      summary: 한 칸을 켜거나 단계를 옮긴다
      description: |
        `id` 로도 받고 `index`+`kind` 로도 받는다. **둘 다 받아야 한다** —
        레지스트리에 아직 없는 번호를 켜 보는 것이 이 화면의 쓸모 중
        하나이기 때문이다. 그렇게 켠 칸은 `unknown` 에 나온다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                  description: 사람이 읽는 번호. `D4-041`
                index: { type: integer, minimum: 0, maximum: 255 }
                kind: { type: string, enum: [toggle, step] }
                on: { type: boolean, description: toggle 일 때 }
                value: { type: integer, minimum: 0, description: step 일 때 }
                op: { type: string, enum: [reset], description: 전부 끈다 }
            examples:
              켠다: { value: { id: D4-041, on: true } }
              단계를옮긴다: { value: { id: W-010, kind: step, value: 3 } }
              번호로: { value: { index: 199, on: true } }
              전부끈다: { value: { op: reset } }
      responses:
        "200":
          description: 바꾼 뒤의 전부
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Quest" }
        "400":
          description: 없는 id, 범위 밖 번호, 음수 단계

  /api/save:
    get:
      tags: [읽기]
      operationId: getSave
      summary: 지금 세계를 저장 형식으로
      description: |
        `hd_world` 의 세이브 형식 그대로다. **다시 계산할 수 있는 것은 없다** —
        무기 종류도 최종 수치도 통행 능력도 들어 있지 않다.
      responses:
        "200":
          description: 세이브
          content:
            application/json:
              schema: { type: object }

  /api/load:
    post:
      tags: [쓰기]
      operationId: postLoad
      summary: 세이브로 이 세계를 갈아 끼운다
      description: |
        읽다가 어긋난 것은 **조용히 빠지지 않는다.** 이 빌드에 없는 물건을
        가리키는 칸은 비워지고 `issues` 에 남는다.

        사람이 하나도 없는 파일은 세계가 아니라 실수이므로 400 이고, 그때
        지금 세계는 그대로 남는다.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "200":
          description: 갈아 끼웠다
          content:
            application/json:
              schema:
                type: object
                properties:
                  loaded: { type: boolean }
                  issues:
                    type: array
                    items:
                      type: object
                      properties:
                        message: { type: string }
                        member: { type: string }
                        item: { type: string }
                  state: { $ref: "#/components/schemas/WorldView" }
        "400":
          description: 사람이 없는 파일. 세계는 그대로다

  /api/loadouts:
    get:
      tags: [읽기]
      operationId: getLoadouts
      summary: 담아 둔 장비 구성
      responses:
        "200":
          description: 구성 전부
          content:
            application/json:
              schema:
                type: object
                properties:
                  loadouts:
                    type: array
                    items: { $ref: "#/components/schemas/Loadout" }
    post:
      tags: [쓰기]
      operationId: loadoutOp
      summary: 담는다 · 입힌다 · 지운다 · 되돌린다
      description: |
        입히는 것은 **보통의 명령 묶음**이다. 그래서 사람이 손으로 갈 수 없는
        상태에는 이것으로도 갈 수 없고, 못 채운 것은 조용히 빠지는 대신 같은
        거절로 돌아온다.

        전원을 벗겼다 다시 입히므로 가방 종류 한도에 걸려 거절이 날 수 있다.
        그때 물건은 원래 팔에 남아 결과는 맞는다 — **`landed` 가 결과를 말하고
        `refused` 는 지나온 길을 말한다.** 둘은 다른 물음이다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [op]
              properties:
                op:
                  type: string
                  enum: [capture, apply, delete, restore]
                name: { type: string }
                loadout: { $ref: "#/components/schemas/Loadout" }
            examples:
              담는다: { value: { op: capture, name: 횃불 파티 } }
              입힌다: { value: { op: apply, name: 횃불 파티 } }
      responses:
        "200":
          description: 한 일
          content:
            application/json:
              schema:
                type: object
                properties:
                  applied: { type: string }
                  landed:
                    type: boolean
                    description: 제자리에 다 갔는가. 거절이 있었는가와 다른 물음이다
                  mismatch:
                    type: array
                    description: 요구한 것과 다른 칸
                    items:
                      type: object
                      properties:
                        member: { type: string }
                        slot: { $ref: "#/components/schemas/SlotName" }
                        wanted: { type: string, nullable: true }
                        got: { type: string, nullable: true }
                  events:
                    type: array
                    items: { $ref: "#/components/schemas/Event" }
                  refused:
                    type: array
                    items: { $ref: "#/components/schemas/Event" }
                  state: { $ref: "#/components/schemas/WorldView" }
                  loadouts:
                    type: array
                    items: { $ref: "#/components/schemas/Loadout" }
        "400":
          description: 모르는 op. 쓸 수 있는 것을 같이 준다
        "404":
          description: 그런 이름의 구성이 없다

  /api/command:
    post:
      tags: [쓰기]
      operationId: applyCommand
      summary: 명령 하나를 적용한다
      description: |
        `{"command": {...}}` 또는 명령 객체 자체를 받는다. 이벤트와 **새 상태 전부**를
        함께 주므로 한 번의 왕복으로 끝난다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  properties:
                    command: { $ref: "#/components/schemas/Command" }
                  required: [command]
                - $ref: "#/components/schemas/Command"
            examples:
              양손무기:
                summary: 장검을 들면 왼손 방패가 가방으로 돌아간다
                value:
                  command:
                    kind: equip
                    member: knight
                    slot: rightHand
                    item: weapon.long_sword
              횃불:
                summary: 왼손에 횃불 — 한손 무기여야 들어간다
                value:
                  command:
                    kind: equip
                    member: knight
                    slot: leftHand
                    item: light.torch
              거절:
                summary: 기사의 부적을 마법사에게 — wrongClass 로 거절된다
                value:
                  command:
                    kind: equip
                    member: magician
                    slot: classAmulet1
                    item: classAmulet.oath_crest
      responses:
        "200":
          description: 적용됨. 거절도 200 이고 `refused` 에 담긴다
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommandResult" }
        "400":
          description: JSON 을 읽을 수 없음 — 세계는 그대로다
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DecodeError" }

  /api/commands:
    post:
      tags: [쓰기]
      operationId: applyCommands
      summary: 명령 여러 개를 순서대로
      description: |
        **해석은 전부 먼저 한다** — 한 항목이라도 읽히지 않으면 아무것도 적용하지
        않고 400 이다. 규칙에 의한 거절은 그와 별개로 항목마다 이벤트로 나온다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                commands:
                  type: array
                  items: { $ref: "#/components/schemas/Command" }
              required: [commands]
      responses:
        "200":
          description: 적용됨
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommandResult" }
        "400":
          description: 항목 하나라도 읽을 수 없음
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DecodeError" }

  /api/magicLight:
    post:
      tags: [쓰기]
      operationId: setMagicLight
      summary: 마법의 횃불을 켜고 끈다
      description: |
        지속 시간은 이 패키지의 일이 아니라서 밖에서 켠다. 실제 횃불보다 **약하다** —
        손을 안 쓰는 대신 그렇다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties: { on: { type: boolean } }
              required: [on]
      responses:
        "200":
          description: 바뀐 상태
          content:
            application/json:
              schema:
                type: object
                properties:
                  magicLight: { type: boolean }
                  state: { $ref: "#/components/schemas/WorldView" }

  /api/reset:
    post:
      tags: [쓰기]
      operationId: reset
      summary: 실험용 5인 파티로 되돌린다
      responses:
        "200":
          description: 되돌림
          content:
            application/json:
              schema:
                type: object
                properties:
                  reset: { type: boolean }
                  state: { $ref: "#/components/schemas/WorldView" }

components:
  schemas:
    SlotName:
      type: string
      description: 부위 여덟. 두 손이 각각 실제 칸이다.
      enum:
        - rightHand
        - leftHand
        - body
        - head
        - legs
        - commonAmulet
        - classAmulet1
        - classAmulet2

    StyleName:
      type: string
      description: 상시 지시 일곱. 절약은 지시가 아니라 토글이다.
      enum: [bulwark, assault, skirmish, volley, firepower, disrupt, mend]

    RefusalReason:
      type: string
      description: |
        닫힌 열거. `wrongSlot`(자리가 아니다)과 `wrongClass`(직업이 아니다)는
        **일부러 다른 답**이다 — 화면이 다른 문장을 말해야 한다.
      enum:
        - noSuchMember
        - noSuchItem
        - notCarried
        - wrongSlot
        - wrongClass
        - offHandLocked
        - mismatchedPair
        - noMainHandToPairWith
        - twoHandedInOffHand
        - slotEmpty
        - cannotRemoveBareHands
        - packFull
        - duplicateAmulet

    Command:
      type: object
      required: [kind]
      properties:
        kind:
          type: string
          enum: [equip, unequip, swapHands, setStyle, give, take, reorder]
        member: { type: string, description: "equip · unequip · swapHands · setStyle" }
        slot: { $ref: "#/components/schemas/SlotName" }
        item: { type: string, description: "equip · give · take" }
        count: { type: integer, default: 1, description: "give · take" }
        style: { $ref: "#/components/schemas/StyleName" }
        thrift: { type: boolean, description: "setStyle. 없으면 그대로 둔다" }
        order:
          type: array
          items: { type: string }
          description: "reorder. 빠진 사람은 뒤에 남는다"

    Event:
      type: object
      required: [kind]
      properties:
        kind:
          type: string
          enum:
            - equipped
            - unequipped
            - offHandCleared
            - handsSwapped
            - styleSet
            - gained
            - lost
            - reordered
            - refused
        member: { type: string }
        slot: { $ref: "#/components/schemas/SlotName" }
        item: { type: string }
        count: { type: integer }
        style: { $ref: "#/components/schemas/StyleName" }
        thrift: { type: boolean }
        order: { type: array, items: { type: string } }
        reason: { $ref: "#/components/schemas/RefusalReason" }

    Fight:
      type: object
      description: 열려 있는 한 판
      properties:
        open: { type: boolean }
        round: { type: integer }
        gap:
          type: integer
          description: 양측이 나눠 갖는 간격 0~2. 격자의 빈 줄 수다
        maxGap: { type: integer }
        phase: { type: string }
        finished: { type: boolean }
        settled: { type: boolean }
        seed: { type: integer }
        result: { type: string, nullable: true, enum: [win, lose, escape, none] }
        party:
          type: array
          items:
            type: object
            properties:
              slot: { type: integer }
              name: { type: string }
              rank: { type: integer, minimum: 1, maximum: 3 }
              hp: { type: integer }
              maxHp: { type: integer }
              sp: { type: integer }
              maxSp: { type: integer }
              esp: { type: integer }
              maxEsp: { type: integer }
              condition: { type: string }
              colorIndex:
                type: integer
                description: |
                  원작 16색 팔레트의 번호(부록 V). 원작은 상태를 **이름
                  색으로만** 알렸다 — 320x240 에 적을 자리가 없었다.
                  그리는 방법은 읽는 쪽의 일이다.
              conscious: { type: boolean }
              weaponKey: { type: string }
              reach: { type: integer }
              braced: { type: boolean }
              staggered: { type: boolean }
              coatings:
                type: array
                items:
                  type: object
                  properties:
                    kind: { type: string }
                    rounds: { type: integer }
              asking:
                type: boolean
                description: 지금 이 사람에게 묻고 있다
        enemies:
          type: array
          items:
            type: object
            properties:
              index: { type: integer }
              key: { type: string }
              name: { type: string }
              ordinal:
                type: integer
                nullable: true
                description: |
                  **같은 종류가 둘 이상일 때만** 1 · 2 · 3. 같은 종류는
                  같은 아이콘이라 번호로만 갈린다. 혼자면 null 이다.
              rank: { type: integer, minimum: 1, maximum: 3 }
              hp: { type: integer }
              condition: { type: string }
              colorIndex: { type: integer }
              conscious: { type: boolean }
              reach: { type: integer }
              distance:
                type: integer
                description: 지금 묻고 있는 사람에게서의 거리
              reachVerdict:
                type: string
                description: |
                  그 거리에서 무기가 닿는지. **사거리 밖은 벌점이지
                  무효가 아니다** — 멀어도 고를 수 있어야 한다.
        decision:
          type: object
          nullable: true
          description: 지금 묻고 있는 것. null 이면 굴리는 중이거나 끝났다
          properties:
            kind:
              type: string
              enum: [action, order, enemy, ally, spell, item, itemUse]
            slot: { type: integer }
            who: { type: string }
            cancelLabel:
              type: string
              description: |
                최상위에서 취소는 턴을 넘기는 것이고 하위 물음에서는 한
                단계 위로 가는 것이다. 둘을 같은 글로 두면 턴을 잃는 줄
                안다.
            options: { type: array, items: { type: object } }
            enemyIndices:
              type: array
              items: { type: integer }
              description: kind=enemy 일 때. 격자에서 고른다
            slots: { type: array, items: { type: integer } }
            groups:
              type: array
              description: kind=spell 일 때 여덟 줄이 넘으면 범위로 접은 묶음
              items: { type: object }
        log:
          type: array
          items: { type: string }
          description: |
            한국어 문장. `@<색>…@@` 표기가 섞여 있다 — 원작이 하던 그대로.
            그리는 방법은 읽는 쪽의 일이다.
        error: { type: string }

    FlagView:
      type: object
      description: 플래그 하나의 정의 + 지금 값
      properties:
        id:
          type: string
          description: 사람이 읽는 번호. `{갈래}-{세자리}`
          example: D4-041
        scope: { type: string, example: D4 }
        index:
          type: integer
          description: cm2 가 쓰는 **진짜 번호**. 이것이 신원이다
        kind: { type: string, enum: [toggle, step] }
        status:
          type: string
          enum: [live, unnamed, planned]
          description: |
            `live` 스크립트가 쓰고 flag4ep1.cm2 에 이름이 있다 ·
            `unnamed` 스크립트가 번호로만 쓴다 ·
            `planned` 아직 어디에도 없다
        cm2Name: { type: string, example: GFD4_JOINNED_SOUL_OF_WATER }
        title: { type: string }
        detail:
          type: string
          description: 언제 켜지는가. 조건이 아니라 사람이 한 일로 적는다
        where: { type: string }
        scripts: { type: array, items: { type: string } }
        grants:
          type: array
          items: { type: string }
          description: 켜지면 파티가 얻는 통행 능력
        note: { type: string }
        raw:
          type: string
          description: 날값 한 줄
          example: Flag::IsSet(41) = 1
        value: { type: integer }
        on: { type: boolean }
        steps:
          type: array
          items: { type: string }
          description: step 일 때 각 단계 한 줄. 0번 칸이 값 0 이다
        stepStates:
          type: array
          items: { type: string, enum: [done, current, ahead] }
          description: 값 3이면 0·1·2 가 done, 3이 current
        atEnd: { type: boolean }

    Quest:
      type: object
      properties:
        scopeOrder: { type: array, items: { type: string } }
        scopeNames: { type: object, additionalProperties: { type: string } }
        flags:
          type: array
          items: { $ref: "#/components/schemas/FlagView" }
        granted:
          type: array
          items: { type: string }
          description: 시나리오가 연 통행 능력. 부적·마법과 다른 세 번째 출처
        collisions:
          type: array
          description: 같은 번호를 두 갈래가 쓰는 곳
          items:
            type: object
            properties:
              kind: { type: string }
              index: { type: integer }
              ids: { type: array, items: { type: string } }
              titles: { type: array, items: { type: string } }
              note: { type: string }
        summary:
          type: object
          properties:
            total: { type: integer }
            on: { type: integer }
            live: { type: integer }
            unnamed: { type: integer }
            planned: { type: integer }
        unknown:
          type: object
          description: 값은 있는데 설명이 없는 칸. 세이브를 읽어 오면 여기 나온다
          properties:
            flags: { type: array, items: { type: integer } }
            variables:
              type: object
              additionalProperties: { type: integer }

    Loadout:
      type: object
      description: 담아 둔 장비 한 벌. 규칙이 아니라 **요구**다
      required: [name, members]
      properties:
        name: { type: string }
        members:
          type: array
          items:
            type: object
            properties:
              ref: { type: string }
              equipment:
                type: object
                description: 부위 이름 → 물건 ref
                additionalProperties: { type: string }
              style: { $ref: "#/components/schemas/StyleName" }
              thrift: { type: boolean }

    Change:
      type: object
      description: 값 하나가 달라진 것
      properties:
        key: { type: string }
        table:
          type: string
          description: |
            이 값이 어느 이름표의 것인지. `GET /api/text` 의 표 이름이다.
            없으면 그냥 숫자다.
          example: stat
        from: {}
        to: {}

    Preview:
      type: object
      description: 적용하면 달라질 것. **세계는 만지지 않았다**
      properties:
        ok:
          type: boolean
          description: 거절이 하나도 없었는가
        events:
          type: array
          items: { $ref: "#/components/schemas/Event" }
        refused:
          type: array
          items: { $ref: "#/components/schemas/Event" }
        changes:
          type: object
          properties:
            members:
              type: array
              items:
                type: object
                properties:
                  ref: { type: string }
                  name: { type: string }
                  changes:
                    type: array
                    items: { $ref: "#/components/schemas/Change" }
                  slots:
                    type: array
                    items:
                      type: object
                      properties:
                        slot: { $ref: "#/components/schemas/SlotName" }
                        from: { type: string, nullable: true }
                        to: { type: string, nullable: true }
                        lockedBefore: { type: boolean }
                        lockedAfter: { type: boolean }
                  grantsGained: { type: array, items: { type: string } }
                  grantsLost: { type: array, items: { type: string } }
                  immunitiesGained: { type: array, items: { type: string } }
                  immunitiesLost: { type: array, items: { type: string } }
            party:
              type: array
              items: { $ref: "#/components/schemas/Change" }
            pack:
              type: array
              items:
                type: object
                properties:
                  item: { type: string }
                  from: { type: integer }
                  to: { type: integer }

    CommandResult:
      type: object
      properties:
        events:
          type: array
          items: { $ref: "#/components/schemas/Event" }
        refused:
          type: array
          description: events 중 거절만 걸러 둔 것
          items: { $ref: "#/components/schemas/Event" }
        state: { $ref: "#/components/schemas/WorldView" }

    DecodeError:
      type: object
      properties:
        error: { type: string }
        field: { type: string }
        allowed: { type: array, items: { type: string } }

    SlotView:
      type: object
      properties:
        slot: { $ref: "#/components/schemas/SlotName" }
        slotWire:
          type: integer
          description: |
            저장·스크립트가 보는 번호. 0~5 는 이전 모델이 쓰던 값이라 옮기지 않는다.
        item: { type: string, nullable: true }
        locked:
          type: boolean
          description: 오른손이 양손 무기라 이 칸이 잠겼다

    MemberView:
      type: object
      properties:
        ref: { type: string }
        name: { type: string }
        class: { type: string }
        classWire: { type: integer }
        classType: { type: string }
        levels: { type: object }
        vitals: { type: object }
        style: { $ref: "#/components/schemas/StyleName" }
        thrift: { type: boolean }
        allowedStyles:
          type: array
          items: { $ref: "#/components/schemas/StyleName" }
        weaponKind:
          type: string
          description: |
            **두 손에서 유도된다.** 필드가 아니고 고르는 칸도 없다.
          enum:
            - unarmed
            - oneHanded
            - swordAndShield
            - spearAndShield
            - dualWield
            - torchbearer
            - greatSword
            - warHammer
            - longStaff
            - polearm
            - lance
            - bow
            - crossbow
            - arbalest
            - thrown
        attackPower:
          type: integer
          description: 쌍수는 두 무기의 **평균**이다 (합이면 두 번 값을 받는다)
        offHandLocked: { type: boolean }
        stats:
          type: object
          description: |
            최종 수치. 더하기가 먼저 들어가고 백분율은 **그 소계**에 걸린다 —
            그래서 장착 순서가 답을 바꿀 수 없다.
          additionalProperties: { type: integer }
        immunities: { type: array, items: { type: string } }
        grants: { type: array, items: { type: string } }
        skillBands:
          type: object
          description: 직업이 무엇인지를 말하는 12칸의 하한·상한
        slots:
          type: array
          items: { $ref: "#/components/schemas/SlotView" }

    ItemView:
      type: object
      properties:
        ref: { type: string }
        nameKey: { type: string }
        name: { type: string, description: "/api/catalog 에서만 붙는다" }
        kind: { type: string }
        kindWire: { type: integer, description: 원작 ITEM_TYPE 번호 }
        hands: { type: integer, enum: [1, 2] }
        shape: { type: string, nullable: true }
        attackPower: { type: integer }
        removable: { type: boolean, description: 맨손은 벗을 수 없다 }
        slots:
          type: array
          description: 갈 수 있는 자리가 **여럿**이다 — 한손 무기는 두 손 다
          items: { $ref: "#/components/schemas/SlotName" }
        classes:
          type: array
          nullable: true
          description: null 이면 누구나 (공통 부적)
          items: { type: string }
        modifiers: { type: array, items: { type: object } }
        immunities: { type: array, items: { type: string } }
        grants: { type: array, items: { type: string } }
        annexKey: { type: string }
        legacyIndex: { type: integer }

    WorldView:
      type: object
      properties:
        members:
          type: array
          items: { $ref: "#/components/schemas/MemberView" }
        pack:
          type: array
          items:
            type: object
            properties:
              item: { type: string }
              count: { type: integer }
        party:
