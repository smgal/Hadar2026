name: hd_battle_text
description: >-
  Korean sentences for hd_battle's events. Pure Dart, no Flutter, no
  terminal — the console and the Flutter view both render from here so
  the wording lives in one place.
publish_to: 'none'
version: 1.0.0

environment:
  sdk: ^3.10.4

dependencies:
  hd_battle:
    path: ../hd_battle

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0
