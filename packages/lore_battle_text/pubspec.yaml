name: lore_battle_text
description: >-
  Korean sentences, names and menu labels for lore_battle's events. Pure
  Dart, no Flutter, no terminal — a console and the Flutter view both
  render from here so the wording lives in one place.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.4

dependencies:
  lore_battle:
    path: ../lore_battle

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0
