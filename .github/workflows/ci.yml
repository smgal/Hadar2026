name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 같은 브랜치에 새 푸시가 오면 진행 중이던 실행은 취소
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: hadar2026_app (analyze + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hadar2026_app
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4
        with:
          # REF_FLUTTER_lore2026 은 읽기 전용 레퍼런스 서브모듈이라 받지 않음
          submodules: false

      - name: Setup Flutter 🚀
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies 📦
        run: flutter pub get

      # `dart format` 게이트는 아직 없음: repo 가 정렬돼 있지 않아 20여 파일이
      # 바뀜. 한 번 일괄 포맷하고 나면 여기에
      # `dart format --output=none --set-exit-if-changed lib test` 를 추가할 것.
      # info 77건은 기존부터 있던 스타일 린트(constant_identifier_names,
      # avoid_print, withOpacity deprecation)라 지금은 게이트하지 않음.
      # error/warning 만 막아서 새 회귀는 잡되 CI 가 처음부터 빨갛지 않게 함.
      # 기존 info 를 정리하고 나면 이 플래그를 떼면 됨.
      - name: Analyze 🔍
        run: flutter analyze --no-fatal-infos

      - name: Test 🧪
        run: flutter test

      - name: Check layering invariants 🧱
        run: |
          fail=0

          check() {
            local label="$1"; shift
            local hits
            hits="$(grep -rn "$@" lib/application/ lib/domain/ || true)"
            if [ -n "$hits" ]; then
              echo "::error::layering violation — $label"
              echo "$hits"
              fail=1
            else
              echo "ok: $label"
            fi
          }

          # application/ 과 domain/ 은 presentation 계층과 파사드를 몰라야 함
          check "application/domain must not import presentation/ or hd_game_main.dart" \
            -E "^import .*(presentation/|hd_game_main\.dart)"

          # 렌더링 라이브러리는 presentation/ 전용
          check "application/domain must not import material/bonfire/flame" \
            -E "package:flutter/material|package:bonfire|package:flame"

          exit $fail

  hd_battle:
    name: hd_battle + hd_battle_text + console (analyze + test + purity)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Setup Dart 🎯
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install Dependencies 📦
        run: |
          cd packages/hd_battle && dart pub get
          cd ../hd_battle_text && dart pub get
          cd ../../hd_battle_console && dart pub get

      - name: Analyze 🔍
        run: |
          cd packages/hd_battle && dart analyze
          cd ../hd_battle_text && dart analyze
          cd ../../hd_battle_console && dart analyze

      # model 의 불변조건 4개는 test/flow/purity_test.dart 가 지킨다 —
      # Flutter 의존 0 · 시드 없는 Random 0 · 한국어 문장 0 · 경험치 표 0.
      # 주석 안의 원작 코드 인용(`Random().nextInt(50)` 등)을 오탐하지 않도록
      # 그쪽은 주석을 걷어내고 본다. 아래 grep 은 import 만 보는 빠른 실패용.
      - name: Test 🧪
        run: |
          cd packages/hd_battle && dart test
          cd ../hd_battle_text && dart test
          cd ../../hd_battle_console && dart test

      - name: Check hd_battle purity 🧱
        run: |
          hits="$(grep -rn "package:flutter" packages/hd_battle/lib packages/hd_battle/test || true)"
          if [ -n "$hits" ]; then
            echo "::error::hd_battle must not depend on Flutter"
            echo "$hits"
            exit 1
          fi
          echo "ok: no Flutter dependency in hd_battle"

          # 문장은 hd_battle_text 에만 있어야 한다. model 이 한국어를 들면
          # 그 순간 view 를 갈아끼울 수 없게 된다.
          hits="$(grep -rn "package:flutter" packages/hd_battle_text/lib || true)"
          if [ -n "$hits" ]; then
            echo "::error::hd_battle_text must not depend on Flutter"
            echo "$hits"
            exit 1
          fi
          echo "ok: no Flutter dependency in hd_battle_text"

      # fixture 는 시연 입력이자 회귀 테스트 입력이다. 재생이 결정적이지
      # 않으면 규칙이나 뽑기 순서가 바뀐 것이다.
      - name: Replay fixtures 🎬
        working-directory: hd_battle_console
        run: |
          fail=0
          for f in fixtures/*/*.json; do
            a="$(dart run bin/battle.dart "$f" --replay --no-status)" || { echo "::error::$f failed to replay"; fail=1; continue; }
            b="$(dart run bin/battle.dart "$f" --replay --no-status)"
            if [ "$a" != "$b" ]; then
              echo "::error::$f is not deterministic"
              fail=1
            else
              echo "ok: $f"
            fi
          done
          exit $fail

  cm2_script:
    name: packages/cm2_script (analyze + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/cm2_script
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Setup Dart 🎯
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install Dependencies 📦
        run: dart pub get

      - name: Analyze 🔍
        run: dart analyze

      - name: Test 🧪
        run: dart test

  hd_world:
    name: hd_world + text + legacy + bridge + lab (analyze + test + purity)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Setup Dart 🎯
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install Dependencies 📦
        run: |
          cd packages/hd_world && dart pub get
          cd ../hd_world_text && dart pub get
          cd ../hd_world_legacy && dart pub get
          cd ../hd_bridge && dart pub get
          cd ../../hd_world_lab && dart pub get

      - name: Analyze 🔍
        run: |
          cd packages/hd_world && dart analyze
          cd ../hd_world_text && dart analyze
          cd ../hd_world_legacy && dart analyze
          cd ../hd_bridge && dart analyze
          cd ../../hd_world_lab && dart analyze

      - name: Test 🧪
        run: |
          cd packages/hd_world && dart test
          cd ../hd_world_text && dart test
          cd ../hd_world_legacy && dart test
          cd ../hd_bridge && dart test
          cd ../../hd_world_lab && dart test

      # 독립성이 이 패키지의 요점이다. test/flow/purity_test.dart 가 주석을
      # 걷어내고 확인하지만, import 만 보는 빠른 실패를 여기 둔다 —
      # 이쪽이 다른 패키지를 참조하기 시작하면 되붙이기가 다시 어려워진다.
      - name: Check hd_world independence 🧱
        run: |
          fail=0

          # 주석은 걸러 낸다 — 문서가 "dart:io 를 쓰지 않는다" 고 적는 것은
          # 위반이 아니다. 실행되는 줄만 본다(purity 테스트와 같은 규칙).
          code_hits() {
            grep -rn "$1" "$2" 2>/dev/null \
              | grep -vE '^[^:]+:[0-9]+: *//' || true
          }

          for forbidden in "package:flutter" "package:hd_battle" "package:cm2_script" "package:hadar2026_app" "dart:io"; do
            hits="$(code_hits "$forbidden" packages/hd_world/lib)"
            if [ -n "$hits" ]; then
              echo "::error::hd_world must not depend on $forbidden"
              echo "$hits"
              fail=1
            fi
          done
          if [ "$fail" = "0" ]; then
            echo "ok: hd_world depends on nothing in this repository"
          fi

          # 한국어는 hd_world_text 한 곳에만 있어야 한다. 모델이 문장을 들면
          # 화면을 갈아끼울 수 없게 된다.
          for pkg in hd_world_text hd_world_legacy hd_bridge; do
            hits="$(code_hits "package:flutter" packages/$pkg/lib)"
            if [ -n "$hits" ]; then
              echo "::error::$pkg must not depend on Flutter"
              echo "$hits"
              fail=1
            fi
          done

          # 다리는 양쪽을 알지만 **양쪽은 서로를 모른다.** 그 규칙이 깨지면
          # 어느 쪽도 따로 시험할 수 없게 된다.
          hits="$(code_hits "package:hd_world" packages/hd_battle/lib)"
          hits="$hits$(code_hits "package:hd_battle" packages/hd_world/lib)"
          if [ -n "$hits" ]; then
            echo "::error::hd_world and hd_battle must not know each other"
            echo "$hits"
            fail=1
          fi
          exit $fail

      # 규격이 파싱되지 않으면 클라이언트가 조용히 틀린 요청을 만든다.
      - name: Check the OpenAPI document parses 📄
        run: python3 -c "import yaml,sys; d=yaml.safe_load(open('hd_world_lab/web/openapi.yaml')); assert d['paths'] and d['components']['schemas']; print('ok:', len(d['paths']), 'paths')"
