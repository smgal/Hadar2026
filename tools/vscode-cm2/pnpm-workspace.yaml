packages:
  - '.'
# pnpm 11 은 설치 스크립트를 돌릴지 패키지마다 정해 줘야 install 이 끝난다.
# esbuild 는 false 여야 한다 — 설치 스크립트가 bin/esbuild 를 네이티브 파일로 바꾸는데
# pnpm 의 .bin 껍데기는 그것을 node 로 실행해 SyntaxError 가 난다. JS 껍데기가
# 그대로 남으면 @esbuild/darwin-arm64 같은 플랫폼 패키지의 바이너리를 알아서 쓴다.
allowBuilds:
  esbuild: false
  '@vscode/vsce-sign': false
  keytar: false
